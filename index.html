<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Nova Rock Trichter Counter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffb347, #ffcc33);
      color: #8b0000;
    }

    h1 {
      font-size: 7vw;
      margin-top: 15px;
      color: #8b0000;
    }

    h2 {
      font-size: 4.5vw;
      font-weight: normal;
      color: #8b0000;
    }

    img {
      width: 60%;
      max-width: 250px;
      border-radius: 15px;
      margin: 10px;
    }

    input, button {
      font-size: 4vw;
      padding: 10px;
      margin: 5px;
    }

    #timer {
      font-size: 6vw;
      margin: 10px;
    }

    #message {
      font-size: 5vw;
      min-height: 40px;
      margin-top: 10px;
    }

    .player {
      background: rgba(255, 255, 255, 0.7);
      margin: 10px auto;
      padding: 10px;
      width: 85%;
      border-radius: 10px;
      font-size: 5vw;
      transition: transform 0.2s;
    }

    .addBtn { background: #ff4500; color: white; border: none; border-radius: 10px; }
    .delBtn { background: crimson; color: white; border: none; border-radius: 10px; }
    .resetBtn { background: gray; color: white; border: none; border-radius: 10px; }
    .alarmBtn { background: #cc5500; color: white; border: none; border-radius: 10px; }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .pop {
      animation: pop 0.4s ease;
    }
  </style>
</head>

<body>

  <h1>Nova Rock Trichter Counter</h1>
  <h2>Bist du der nächste Trichter Alexander Hold?</h2>

  <img src="dein-bild.jpg" alt="Party Bild">

  <div id="timer">30:00</div>
  <div>🚨 Trichter Alarm</div>
  <div id="message"></div>

  <input id="nameInput" placeholder="Spieler Name">
  <button onclick="addPlayer()">Spieler hinzufügen</button>

  <button class="alarmBtn" onclick="toggleAlarm()">🚨 Trink Alarm</button>

  <div id="players"></div>

  <!-- Sounds -->
  <audio id="trichterSound" src="trichterSound.mp3"></audio>
  <audio id="alarmSound" src="alarmSound.mp3"></audio>

  <script>
    let players = JSON.parse(localStorage.getItem("players") || "[]");

    let alarmActive = JSON.parse(localStorage.getItem("alarmActive") || "false");
    let alarmTriggered = false;

    let lastTime = parseInt(localStorage.getItem("lastTime") || Date.now(), 10);

    const trichterSound = document.getElementById("trichterSound");
    const alarmSound = document.getElementById("alarmSound");

const funnyTexts = [
  "🍺 Du Trichter-Legende!",
  "🔥 I glaub es eskaliert komplett!",
  "🔥 du billiger Hose!",
  "💀 Saufa Saufa Saufa?!",
  "🍻 Da Hund is zua!",
  "🚀 Du bist die Trichter Königin!",
  "🎉 So schnö hot nu nie wer trichtert",
  "🍾 Trichter schmeckt einfach gut",
  "🥴 Bitte ned speibn",
  "⚡ Des geht nu schnölla oder?",
  "🧠 Trichterin Barbara Salesch!",
  "🏆 Saufa und vü Raucha",
  "🔥 Einfach Orangensaft",
  "🍻 Frag nicht was für Saft!",
  "💅 Slay Bitch",
  "💥 Bist du da Wirtshausfraunz?!",
  "💥 Spast!",
  "💥 Ich muss rauuus!",
  "🚀 Ein Adler der versucht hat zu fliegen...!",
  "🥴 Wer trichtert so schnell durch Nacht und Wind?",
  "💅 Go Girl!"
    ];

    function playSound(audio) {
      audio.pause();
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function save() {
      localStorage.setItem("players", JSON.stringify(players));
      localStorage.setItem("lastTime", lastTime);
      localStorage.setItem("alarmActive", JSON.stringify(alarmActive));
    }

    function addPlayer() {
      const input = document.getElementById("nameInput");
      const name = input.value.trim();
      if (!name) return;

      players.push({ name, count: 0 });
      input.value = "";

      save();
      render();
    }

    function deletePlayer(i) {
      players.splice(i, 1);
      save();
      render();
    }

    function resetPlayer(i) {
      players[i].count = 0;
      save();
      render();
    }

    function triggerFiveEvent(i) {
      const msg = document.getElementById("message");
      msg.innerText = "🎉 5 TRICHTER BONUS!";

      const el = document.getElementsByClassName("player")[i];
      if (el) {
        el.classList.add("pop");
        setTimeout(() => el.classList.remove("pop"), 400);
      }

      setTimeout(() => {
        msg.innerText = "";
      }, 2500);
    }

    function addTrichter(i) {
      players[i].count++;
      lastTime = Date.now();

      playSound(trichterSound);

      // 📳 Vibration
      if (navigator.vibrate) {
        navigator.vibrate(150);
      }

      // 📝 Random Text
      const msg = document.getElementById("message");
      msg.innerText = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];

      save();
      render();
    }

    function toggleAlarm() {
      alarmActive = !alarmActive;

      if (alarmActive) {
        playSound(alarmSound); // 🔊 Sound beim Einschalten
      } else {
        alarmSound.pause();
        alarmSound.currentTime = 0;
      }

      save();
    }

    function render() {
      const container = document.getElementById("players");
      container.innerHTML = "";

      players.forEach((p, i) => {
        container.innerHTML += `
          <div class="player">
            🍺 ${p.name} — ${p.count} Trichter<br>
            <button class="addBtn" onclick="addTrichter(${i})">+1 🍺</button>
            <button class="resetBtn" onclick="resetPlayer(${i})">Reset</button>
            <button class="delBtn" onclick="deletePlayer(${i})">X</button>
          </div>
        `;
      });
    }

    setInterval(() => {
      let now = Date.now();
      let diff = 1800000 - (now - lastTime);

      if (diff < 0) diff = 0;

      let minutes = Math.floor(diff / 60000);
      let seconds = Math.floor((diff % 60000) / 1000);

      document.getElementById("timer").innerText =
        `${minutes}:${seconds.toString().padStart(2, "0")}`;

      if (diff === 0 && alarmActive && !alarmTriggered) {
        alarmTriggered = true;

        playSound(alarmSound);

        document.getElementById("message").innerText =
          "🚨 ZEIT FÜR EINEN TRICHTER! 🍺";

        setTimeout(() => {
          document.getElementById("message").innerText = "";
        }, 3000);
      }

      if (diff > 0) {
        alarmTriggered = false;
      }

    }, 1000);

    render();
  </script>

</body>
</html>
