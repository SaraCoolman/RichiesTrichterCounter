<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>TrichterAlexanderHold</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: #ffd1dc;
      color: #111;
    }

    h1 {
      font-size: 7vw;
      color: #87cefa;
      margin-top: 20px;
    }

    input, button {
      font-size: 4vw;
      padding: 10px;
      margin: 5px;
    }

    .player {
      background: white;
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      border-radius: 10px;
      font-size: 5vw;
    }

    .addBtn {
      background: limegreen;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <h1>🍺 TrichterAlexanderHold 🍺</h1>

  <input id="nameInput" placeholder="Spieler Name">
  <button onclick="addPlayer()">Spieler hinzufügen</button>

  <div id="players"></div>

  <script>
    let players = JSON.parse(localStorage.getItem("players") || "[]");

    function save() {
      localStorage.setItem("players", JSON.stringify(players));
    }

    function addPlayer() {
      const name = document.getElementById("nameInput").value.trim();
      if (!name) return;

      players.push({ name: name, count: 0 });

      save();
      render();
    }

    function addTrichter(index) {
      players[index].count++;

      save();
      render();
    }

    function render() {
      const container = document.getElementById("players");
      container.innerHTML = "";

      players.forEach((p, i) => {
        container.innerHTML += `
          <div class="player">
            🍺 ${p.name} — ${p.count} Trichter<br>
            <button class="addBtn" onclick="addTrichter(${i})">+1 Trichter</button>
          </div>
        `;
      });
    }

    render();
  </script>

</body>
</html>
