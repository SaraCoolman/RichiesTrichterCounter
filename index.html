<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Nova Rock Trichter Counter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffb347, #ffcc33);
      color: #8b0000;
    }

    h1 {
      font-size: 7vw;
      margin-top: 15px;
      color: #8b0000;
    }

    h2 {
      font-size: 4.5vw;
      font-weight: normal;
      color: #8b0000;
    }

    img {
      width: 60%;
      max-width: 250px;
      border-radius: 15px;
      margin: 10px;
    }

    input, button {
      font-size: 4vw;
      padding: 10px;
      margin: 5px;
    }

    .player {
      background: rgba(255, 255, 255, 0.7);
      margin: 10px auto;
      padding: 10px;
      width: 85%;
      border-radius: 10px;
      font-size: 5vw;
    }

    .addBtn { background: #ff4500; color: white; border: none; border-radius: 10px; }
    .delBtn { background: crimson; color: white; border: none; border-radius: 10px; }
    .resetBtn { background: gray; color: white; border: none; border-radius: 10px; }
    .alarmBtn { background: #cc5500; color: white; border: none; border-radius: 10px; }

    #message {
      font-size: 5vw;
      min-height: 40px;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>🎸 Nova Rock Trichter Counter 🍺</h1>
  <h2>Bist du der nächste Trichter Alexander Hold?</h2>

  <img src="dein-bild.jpg" alt="Party Bild">

  <input id="nameInput" placeholder="Spieler Name">
  <button onclick="addPlayer()">Spieler hinzufügen</button>
  <button class="alarmBtn" onclick="toggleAlarm()">🚨 Trink Alarm</button>

  <div id="message"></div>

  <div id="players"></div>

  <!-- Sounds -->
  <audio id="trichterSound" src="trichterSound.mp3"></audio>
  <audio id="alarmSound" src="alarmSound.mp3"></audio>

<script>
let players = JSON.parse(localStorage.getItem("players") || "[]");

let alarmActive = JSON.parse(localStorage.getItem("alarmActive") || "false");
let alarmTriggered = false;

let lastTime = parseInt(localStorage.getItem("lastTime") || Date.now(), 10);

const trichterSound = document.getElementById("trichterSound");
const alarmSound = document.getElementById("alarmSound");

const funnyTexts = [
  "🍺 Legendärer Trichter!",
  "🔥 Das eskaliert gerade!",
  "💀 Wer hat dir das erlaubt?!",
  "🍻 Festival-Level erreicht!",
  "🚀 Du bist nicht mehr zu stoppen!"
];

function playSound(audio) {
  audio.pause();
  audio.currentTime = 0;
  audio.play().catch(() => {});
}

function showMessage(text) {
  const msg = document.getElementById("message");
  msg.innerText = text;

  setTimeout(() => {
    msg.innerText = "";
  }, 2500);
}

function save() {
  localStorage.setItem("players", JSON.stringify(players));
  localStorage.setItem("lastTime", lastTime);
  localStorage.setItem("alarmActive", JSON.stringify(alarmActive));
}

function addPlayer() {
  const input = document.getElementById("nameInput");
  const name = input.value.trim();
  if (!name) return;

  players.push({ name, count: 0 });
  input.value = "";

  save();
  render();
}

function deletePlayer(i) {
  players.splice(i, 1);
  save();
  render();
}

function resetPlayer(i) {
  players[i].count = 0;
  save();
  render();
}

function addTrichter(i) {
  players[i].count++;
  lastTime = Date.now();

  playSound(trichterSound);

  // 🎉 lustiger Spruch nach jedem Trichter
  const text = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];
  showMessage(text);

  save();
  render();
}

function toggleAlarm() {
  alarmActive = !alarmActive;
  save();

  if (alarmActive) {
    alarmTriggered = false;
    playSound(alarmSound);
    showMessage("🚨 Trink Alarm aktiviert!");
  } else {
    alarmSound.pause();
    alarmSound.currentTime = 0;
    showMessage("⛔ Trink Alarm deaktiviert!");
  }
}

function render() {
  const container = document.getElementById("players");
  container.innerHTML = "";

  players.forEach((p, i) => {
    container.innerHTML += `
      <div class="player">
        🍺 ${p.name} — ${p.count} Trichter<br>
        <button class="addBtn" onclick="addTrichter(${i})">+1</button>
        <button class="resetBtn" onclick="resetPlayer(${i})">Reset</button>
        <button class="delBtn" onclick="deletePlayer(${i})">X</button>
      </div>
    `;
  });
}

/* ⏱️ 30 MIN TIMER */
setInterval(() => {
  let now = Date.now();
  let diff = 1800000 - (now - lastTime); // 30 Minuten

  if (diff <= 0 && !alarmTriggered && alarmActive) {
    alarmTriggered = true;

    playSound(alarmSound);

    showMessage("🍺 Host du scho a hoibe Stund kan Trichter mehr drunga");

    setTimeout(() => {
      document.getElementById("message").innerText = "";
    }, 5000);
  }

  if (diff > 0) {
    alarmTriggered = false;
  }

}, 1000);

render();
</script>

</body>
</html>
