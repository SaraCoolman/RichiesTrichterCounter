<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Nova Rock Trichter Counter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffb347, #ffcc33);
      color: #8b0000;
    }

    h1 {
      font-size: 7vw;
      margin-top: 15px;
      color: #8b0000;
    }

    h2 {
      font-size: 4.5vw;
      font-weight: normal;
      color: #8b0000;
      margin-bottom: 10px;
    }

    img {
      width: 60%;
      max-width: 250px;
      border-radius: 15px;
      margin: 10px;
    }

    input, button {
      font-size: 4vw;
      padding: 10px;
      margin: 5px;
    }

    .player {
      background: rgba(255, 255, 255, 0.7);
      margin: 10px auto;
      padding: 10px;
      width: 80%;
      border-radius: 10px;
      font-size: 5vw;
    }

    .addBtn {
      background: #ff4500;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
    }

    .alarmBtn {
      background: #cc5500;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 10px;
    }

    #timer {
      font-size: 6vw;
      margin: 10px;
    }
  </style>
</head>

<body>

  <h1>🎸 Nova Rock Trichter Counter 🍺</h1>
  <h2>Bist du der nächste Trichter Alexander Hold?</h2>

  <img src="dein-bild.jpg" alt="Party Bild">

  <div id="timer">30:00</div>

  <br>

  <input id="nameInput" placeholder="Spieler Name">
  <button onclick="addPlayer()">Spieler hinzufügen</button>

  <button class="alarmBtn" onclick="toggleAlarm()">🚨 Trink Alarm</button>
  <button class="alarmBtn" onclick="manualAlarm()">🚨 Alarm manuell</button>

  <div id="players"></div>

  <!-- Sounds -->
  <audio id="trichterSound" src="trichterSound.mp3"></audio>
  <audio id="alarmSound" src="alarmSound.mp3"></audio>

  <script>
    let players = JSON.parse(localStorage.getItem("players") || "[]");

    let alarmActive = false;
    let alarmTriggered = false;

    let lastTime = parseInt(localStorage.getItem("lastTime") || Date.now(), 10);

    const trichterSound = document.getElementById("trichterSound");
    const alarmSound = document.getElementById("alarmSound");

    function playSound(audio) {
      audio.pause();
      audio.currentTime = 0;
      audio.play().catch(() => {});
    }

    function save() {
      localStorage.setItem("players", JSON.stringify(players));
      localStorage.setItem("lastTime", lastTime);
    }

    function addPlayer() {
      const input = document.getElementById("nameInput");
      const name = input.value.trim();

      if (!name) return;

      players.push({ name: name, count: 0 });
      input.value = "";

      save();
      render();
    }

    function addTrichter(index) {
      players[index].count++;
      lastTime = Date.now();

      playSound(trichterSound);

      save();
      render();
    }

    function toggleAlarm() {
      alarmActive = !alarmActive;

      if (alarmActive) {
        alarmTriggered = false;
      } else {
        alarmSound.pause();
        alarmSound.currentTime = 0;
      }
    }

    function manualAlarm() {
      playSound(alarmSound);
    }

    function render() {
      const container = document.getElementById("players");
      container.innerHTML = "";

      players.forEach((p, i) => {
        container.innerHTML += `
          <div class="player">
            🍺 ${p.name} — ${p.count} Trichter<br>
            <button class="addBtn" onclick="addTrichter(${i})">
              +1 Trichter
            </button>
          </div>
        `;
      });
    }

    setInterval(() => {
      let now = Date.now();
      let diff = 1800000 - (now - lastTime);

      if (diff < 0) diff = 0;

      let minutes = Math.floor(diff / 60000);
      let seconds = Math.floor((diff % 60000) / 1000);

      document.getElementById("timer").innerText =
        `${minutes}:${seconds.toString().padStart(2, "0")}`;

      if (diff === 0 && !alarmTriggered && alarmActive) {
        alarmTriggered = true;
        playSound(alarmSound);
        alert("🚨 Hobts a hoibe Stunde kan Trichter drunga?! Frechheit! 🍺");
      }

      if (diff > 0) {
        alarmTriggered = false;
      }

    }, 1000);

    render();
  </script>

</body>
</html>
