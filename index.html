<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Nova Rock Trichter Counter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #ffb347, #ffcc33);
      color: #8b0000;
    }

    h1 {
      font-size: 7vw;
      margin-top: 15px;
    }

    h2 {
      font-size: 4.5vw;
      font-weight: normal;
    }

    img {
      width: 60%;
      max-width: 250px;
      border-radius: 15px;
      margin: 10px;
    }

    input, button {
      font-size: 4vw;
      padding: 10px;
      margin: 5px;
    }

    #timer {
      font-size: 6vw;
      margin: 10px;
    }

    #message {
      font-size: 5vw;
      min-height: 40px;
      margin-top: 10px;
    }

    .player {
      background: rgba(255,255,255,0.7);
      margin: 10px auto;
      padding: 10px;
      width: 85%;
      border-radius: 10px;
      font-size: 5vw;
    }

    .addBtn { background: #ff4500; color: white; border: none; border-radius: 10px; }
    .delBtn { background: crimson; color: white; border: none; border-radius: 10px; }
    .resetBtn { background: gray; color: white; border: none; border-radius: 10px; }
    .alarmBtn { background: #cc5500; color: white; border: none; border-radius: 10px; }
  </style>
</head>

<body>

  <h1>🎸 Nova Rock Trichter Counter 🍺</h1>
  <h2>Bist du der nächste Trichter Alexander Hold?</h2>

  <img src="dein-bild.jpg" alt="Party Bild">

  <div id="timer">30:00</div>
  <div id="message"></div>

  <input id="nameInput" placeholder="Spieler Name">
  <button onclick="addPlayer()">Spieler hinzufügen</button>

  <button class="alarmBtn" onclick="toggleAlarm()">🚨 Trink Alarm</button>

  <div id="players"></div>

  <!-- Sounds -->
  <audio id="trichterSound" src="trichterSound.mp3" preload="auto"></audio>
  <audio id="alarmSound" src="alarmSound.mp3" preload="auto"></audio>

<script>
/* =========================
   SAFE INITIAL STATE
========================= */

let players = [];
let alarmActive = false;
let alarmTriggered = false;
let lastTime = Date.now();

/* =========================
   SAFE LOAD STORAGE
========================= */

try {
  const p = JSON.parse(localStorage.getItem("players"));
  if (Array.isArray(p)) players = p;
} catch {}

const savedAlarm = localStorage.getItem("alarmActive");
if (savedAlarm === "true") alarmActive = true;

const savedTime = Number(localStorage.getItem("lastTime"));
if (!isNaN(savedTime) && savedTime > 0) {
  lastTime = savedTime;
}

/* =========================
   ELEMENTS
========================= */

const trichterSound = document.getElementById("trichterSound");
const alarmSound = document.getElementById("alarmSound");

/* =========================
   SAFE SOUND
========================= */

function playSound(audio) {
  if (!audio) return;

  try {
    audio.pause();
    audio.currentTime = 0;
    const p = audio.play();
    if (p) p.catch(() => {});
  } catch {}
}

/* =========================
   SAVE
========================= */

function save() {
  try {
    localStorage.setItem("players", JSON.stringify(players));
    localStorage.setItem("lastTime", String(lastTime));
    localStorage.setItem("alarmActive", String(alarmActive));
  } catch {}
}

/* =========================
   PLAYER ACTIONS
========================= */

function addPlayer() {
  const input = document.getElementById("nameInput");
  if (!input) return;

  const name = input.value.trim();
  if (!name) return;

  players.push({ name, count: 0 });

  input.value = "";

  save();
  render();
}

function deletePlayer(i) {
  players.splice(i, 1);
  save();
  render();
}

function resetPlayer(i) {
  players[i].count = 0;
  save();
  render();
}

/* =========================
   TRICHTER ACTION
========================= */

function addTrichter(i) {
  if (!players[i]) return;

  players[i].count++;
  lastTime = Date.now();

  playSound(trichterSound);

  if (navigator.vibrate) {
    navigator.vibrate(150);
  }

  const texts = [
      "🍺 Du Trichter-Legende!",
      "🔥 I glaub es eskaliert komplett!",
      "💀 Saufa Saufa Saufa?!",
      "🍻 Da Hund is zua!",
      "🚀 Du bist die Trichter Königin!",
      "🎉 So schnö hot nu nie wer trichtert",
      "🍾 Trichter schmeckt einfach gut",
      "🥴 Bitte ned speibn",
      "⚡ Des geht nu schnölla oder?",
      "🧠 Trichterin Barbara Salesch!",
      "🏆 Saufa und vü Raucha",
      "🔥 Einfach Orangensaft",
      "🍻 Frag nicht was für Saft!",
      "💅 Slay Bitch",
      "💥 Bist du da Wirtshausfraunz?!"
	  "💥 Spast!"
	  "🥴 Wer trichtert so schnell durch Nacht und Wind?",
  ];

  const msg = document.getElementById("message");
  msg.innerText = texts[Math.floor(Math.random() * texts.length)];

  setTimeout(() => {
    msg.innerText = "";
  }, 2000);

  save();
  render();
}

/* =========================
   ALARM
========================= */

function toggleAlarm() {
  alarmActive = !alarmActive;

  if (alarmActive) {
    playSound(alarmSound);
  } else {
    try {
      alarmSound.pause();
      alarmSound.currentTime = 0;
    } catch {}
  }

  save();
}

/* =========================
   RENDER SAFE
========================= */

function render() {
  const container = document.getElementById("players");
  if (!container) return;

  container.innerHTML = "";

  if (players.length === 0) return;

  players.forEach((p, i) => {
    container.innerHTML += `
      <div class="player">
        🍺 ${p.name} — ${p.count} Trichter<br>
        <button class="addBtn" onclick="addTrichter(${i})">+1</button>
        <button class="resetBtn" onclick="resetPlayer(${i})">Reset</button>
        <button class="delBtn" onclick="deletePlayer(${i})">X</button>
      </div>
    `;
  });
}

/* =========================
   TIMER (SAFE)
========================= */

setInterval(() => {
  const now = Date.now();
  const diff = Math.max(0, 1800000 - (now - lastTime));

  const min = Math.floor(diff / 60000);
  const sec = Math.floor((diff % 60000) / 1000);

  const timer = document.getElementById("timer");
  if (timer) {
    timer.innerText = `${min}:${sec.toString().padStart(2, "0")}`;
  }

  if (diff === 0 && alarmActive && !alarmTriggered) {
    alarmTriggered = true;

    playSound(alarmSound);

    const msg = document.getElementById("message");
    if (msg) {
      msg.innerText = "🚨 ZEIT FÜR EINEN TRICHTER!";
      setTimeout(() => msg.innerText = "", 3000);
    }
  }

  if (diff > 0) {
    alarmTriggered = false;
  }

}, 1000);

/* =========================
   INIT
========================= */

render();

</script>

</body>
</html>
